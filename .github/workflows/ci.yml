name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (4 proveedores simulados)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Versiones coherentes (package.json = manifest.json)
        run: npm run version:check
      - name: Prueba rápida (Autos Juanito)
        run: npm run test:smoke
      - name: Flujo de compra en la tienda de ejemplo
        run: npm run test:demo
      - name: Capturas si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: capturas
          path: test/*.png
          if-no-files-found: ignore

  package:
    name: Empaquetar para Chrome Web Store
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: webmcp-flow-extension
          path: dist/*.zip
          if-no-files-found: error
